<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
    <defs>
        <!-- Degradado Azul Clínico Principal -->
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7" />
            <stop offset="100%" stop-color="#0F172A" />
        </linearGradient>

        <!-- Degradado Verde Salud / Acento -->
        <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981" />
            <stop offset="100%" stop-color="#059669" />
        </linearGradient>

        <!-- Sombra suave profesional -->
        <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12" />
        </filter>
    </defs>

    <!-- ISOTIPO (Emblema Médico) -->
    <g transform="translate(15, 10)" filter="url(#softShadow)">
        <!-- Fondo circular limpio -->
        <circle cx="50" cy="50" r="46" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
        
        <!-- Base de la Cruz / Silueta Cuidado -->
        <path d="M 50 18 
                 C 35 18, 24 30, 24 45 
                 C 24 64, 44 80, 50 84 
                 C 56 80, 76 64, 76 45 
                 C 76 30, 65 18, 50 18 Z" fill="url(#blueGrad)" opacity="0.1" />

        <!-- Cruz Médica Estilizada -->
        <path d="M 43 28 H 57 V 43 H 72 V 57 H 57 V 72 H 43 V 57 H 28 V 43 H 43 Z" fill="url(#blueGrad)" />

        <!-- Hoja de Cuidado / Salud (Superpuesta) -->
        <path d="M 50 48 
                 C 50 48, 68 38, 74 54 
                 C 78 64, 68 76, 56 76 
                 C 44 76, 50 62, 50 48 Z" fill="url(#greenGrad)" opacity="0.9" />
    </g>

    <!-- TIPOGRAFÍA Y TEXTO INSTITUCIONAL -->
    <g font-family="&#39;Inter&#39;, &#39;Segoe UI&#39;, system-ui, sans-serif" filter="url(#softShadow)">
        <!-- Dominio de Marca -->
        <text x="130" y="58" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
            CMC
        </text>
        
        <!-- Subtítulo Institucional -->
        <text x="132" y="82" font-size="14" font-weight="600" fill="#0284C7" letter-spacing="3.5">
            CENTRO MÉDICO CATACAMAS
        </text>

        <!-- Indicador de Punto Verde (Acento) -->
        <circle cx="227" cy="50" r="4.5" fill="#10B981" />
    </g>
</svg>