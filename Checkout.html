<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Nexora</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Fuente recomendada para este estilo limpio -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-fondo">

    <div class="checkout-container">
        
        <!-- Columna Izquierda: Formulario -->
        <div class="summary-card">
            <h1 class="titulo-seccion">Información de envío</h1>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">NOMBRE COMPLETO *</label>
                    <input type="text" id="nombre" placeholder="Ej. Andrea Martínez" required>
                </div>

                <div class="form-group">
                    <label for="direccion">DIRECCIÓN DE ENVÍO *</label>
                    <textarea id="direccion" rows="3" placeholder="Colonia, calle, casa y referencias" required></textarea>
                </div>

                <!-- Fila de dos columnas para correo y teléfono -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="correo">CORREO ELECTRÓNICO *</label>
                        <input type="email" id="correo" placeholder="nombre@correo.com" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">TELÉFONO *</label>
                        <input type="tel" id="telefono" placeholder="9999-9999" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="ciudad">CIUDAD *</label>
                    <select id="ciudad" required>
                        <option value="" disabled selected>Selecciona tu ciudad</option>
                        <option value="catacamas">Catacamas</option>
                        <option value="tegucigalpa">Tegucigalpa</option>
                    </select>
                </div>

                <button type="submit" class="btn-confirmar">CONFIRMAR PEDIDO &rarr;</button>
            </form>
        </div>

        <!-- Columna Derecha: Resumen de Orden -->
        <div class="summary-section">
            <div class="summary-card">
                <span class="subtitle">TU COMPRA</span>
                <h2 class="titulo-resumen">Resumen de orden</h2>

                <!-- Producto -->
                <div class="producto-item">
                    <div class="producto-img">
                        <!-- Aquí puedes poner la etiqueta img real -->
                        <div class="img-placeholder"></div>
                    </div>
                    <div class="producto-info">
                        <span class="producto-nombre">NovaBook Air 14</span>
                        <span class="producto-cant">Cant. 1</span>
                    </div>
                    <span class="producto-precio">L 27,999.00</span>
                </div>

                <hr class="divisor">

                <!-- Totales -->
                <div class="totales-row">
                    <span class="etiqueta">Subtotal</span>
                    <span class="valor">L 27,999.00</span>
                </div>
                <div class="totales-row">
                    <span class="etiqueta">ISV (15%)</span>
                    <span class="valor">L 4,199.85</span>
                </div>
                <div class="totales-row">
                    <span class="etiqueta">Envío</span>
                    <span class="valor texto-verde">GRATIS</span>
                </div>

                <hr class="divisor">

                <div class="totales-row total-final">
                    <span class="etiqueta">Total</span>
                    <span class="valor">L 32,198.85</span>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
