<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Nexora</title>
    <link rel="stylesheet" href="css/styles_checkout.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos base y variables de Modo Oscuro para el Checkout */
        body.dark-mode {
            background-color: #0f172a !important;
            color: #f8fafc !important;
        }
        body.dark-mode .summary-card {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        body.dark-mode input, 
        body.dark-mode textarea, 
        body.dark-mode select {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        body.dark-mode h1, 
        body.dark-mode h2, 
        body.dark-mode label, 
        body.dark-mode span,
        body.dark-mode .etiqueta {
            color: #f8fafc !important;
        }
        body.dark-mode header {
            background-color: #1e293b !important;
            border-bottom-color: #334155 !important;
        }
        body.dark-mode .nav-link {
            color: #94a3b8 !important;
        }
        body.dark-mode #nav-login {
            color: #94a3b8 !important;
        }
    </style>
</head>
<body class="bg-fondo">

    <!-- 1. Contenedor para el Header -->
    <div id="header-container"></div>

    <!-- 2. Contenido Principal del Checkout -->
    <div class="checkout-container">
        
        <!-- Columna Izquierda: Formulario -->
        <div class="summary-card">
            <h1 class="titulo-seccion">Información de envío</h1>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">NOMBRE COMPLETO *</label>
                    <input type="text" id="nombre" placeholder="Ej. Andrea Martínez" required>
                </div>

                <div class="form-group">
                    <label for="direccion">DIRECCIÓN DE ENVÍO *</label>
                    <textarea id="direccion" rows="3" placeholder="Colonia, calle, casa y referencias" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="correo">CORREO ELECTRÓNICO *</label>
                        <input type="email" id="correo" placeholder="nombre@correo.com" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">TELÉFONO *</label>
                        <input type="tel" id="telefono" placeholder="9999-9999" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="ciudad">CIUDAD *</label>
                    <select id="ciudad" required>
                        <option value="" disabled selected>Selecciona tu ciudad</option>
                        <option value="catacamas">Catacamas</option>
                        <option value="tegucigalpa">Tegucigalpa</option>
                    </select>
                </div>

                <button type="submit" class="btn-confirmar">CONFIRMAR PEDIDO &rarr;</button>
            </form>
        </div>

        <!-- Columna Derecha: Resumen de Orden -->
        <div class="summary-section">
            <div class="summary-card">
                <span class="subtitle">TU COMPRA</span>
                <h2 class="titulo-resumen">Resumen de orden</h2>

                <div class="producto-item">
                    <div class="producto-img">
                        <div class="img-placeholder"></div>
                    </div>
                    <div class="producto-info">
                        <span class="producto-nombre">xxxxxx</span>
                        <span class="producto-cant">Cant. x</span>
                    </div>
                    <span class="producto-precio">L 0,000.00</span>
                </div>

                <hr class="divisor">

                <div class="totales-row">
                    <span class="etiqueta">Subtotal</span>
                    <span class="valor">L 0,000.00</span>
                </div>
                <div class="totales-row">
                    <span class="etiqueta">ISV (15%)</span>
                    <span class="valor">L 0,000.00</span>
                </div>
                <div class="totales-row">
                    <span class="etiqueta">Envío</span>
                    <span class="valor texto-verde">GRATIS</span>
                </div>

                <hr class="divisor">

                <div class="totales-row total-final">
                    <span class="etiqueta">Total</span>
                    <span class="valor">L 0,000.00</span>
                </div>
            </div>
        </div>

    </div>

    <!-- 3. Contenedor para el Footer -->
    <div id="footer-container"></div>

    <!-- Script para Cargar Componentes y Activar el Modo Oscuro al hacer Clic en la Luna -->
    <script>
        async function iniciarPagina() {
            try {
                const resHeader = await fetch('header.html');
                if (resHeader.ok) {
                    document.getElementById('header-container').innerHTML = await resHeader.text();
                }
                
                const resFooter = await fetch('footer.html');
                if (resFooter.ok) {
                    document.getElementById('footer-container').innerHTML = await resFooter.text();
                }

                // Activador del botón de modo oscuro
                const botonTema = document.getElementById('theme-toggle');
                if (botonTema) {
                    botonTema.addEventListener('click', () => {
                        document.body.classList.toggle('dark-mode');
                    });
                }
            } catch (e) {
                console.log("Error cargando componentes:", e);
            }
        }
        iniciarPagina();
    </script>

</body>
</html>
