<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mensaje de prueba</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f4f6f8;
    }
    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 560px;
    }
    .badge {
      display: inline-block;
      padding: .25rem .6rem;
      background: #0078d4;
      color: #fff;
      border-radius: 6px;
      font-weight: 600;
      margin-bottom: .75rem;
    }
    button {
      margin-top: 1rem;
      padding: .5rem 1rem;
      border: none;
      border-radius: 6px;
      background: #0078d4;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Mensaje de prueba</div>
    <h1>¡Hola! Esto es un mensaje de prueba en HTML5</h1>
    <p id="info">Fecha y hora: <strong id="now"></strong></p>
    <button onclick="document.getElementById('info').style.color = '#d9534f';">
      Cambiar color del texto
    </button>
  </div>

  <script>
    // Muestra la fecha/hora actual
    document.getElementById('now').textContent = new Date().toLocaleString();
  </script>
</body>
</html>
