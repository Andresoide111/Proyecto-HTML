<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA - Carrito de Compras</title>
    <link rel="stylesheet" href="../css/styles_shopcart.css">
    <script>
        // Función para cargar el Header
        fetch('../components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
            });

        // Función para cargar el Footer
        fetch('../components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>
</head>

<body>
    <div id="header-container"></div>
    
    <a class="back-link" href="../Index.html">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M19 12H5m0 0 7 7m-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Seguir comprando</span>
    </a>

    <main class="cart-content">
        <p class="eyebrow">TU SELECCIÓN</p>
        <h1>Carrito de compras</h1>
        <p class="item-count">0 artículos en tu carrito</p>

        <section class="empty-cart" aria-labelledby="empty-cart-title">
            <div class="empty-cart-content">
                <div class="cart-icon">
                    <svg aria-hidden="true" viewBox="0 0 40 40" fill="none">
                        <path d="M4 7h4l4.2 18.1a3 3 0 0 0 2.9 2.3h14.2a3 3 0 0 0 2.9-2.3L35 13H10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="16" cy="34" r="3" fill="currentColor"/>
                        <circle cx="30" cy="34" r="3" fill="currentColor"/>
                    </svg>
                </div>
                <h2 id="empty-cart-title">Tu carrito está vacío</h2>
                <p class="empty-message">Explora nuestro catálogo y encuentra tu próxima gran herramienta.</p>
                <a class="products-link" href="../Index.html">
                    <span>VER PRODUCTOS</span>
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                        <path d="M5 12h14m0 0-7-7m7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>
        </section>
    </main>
    <div id="footer-container"></div>
</body>
</html>
